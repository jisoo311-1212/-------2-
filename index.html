<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片 | 林知夏</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 页面主内容：使用单张名片承载个人信息 -->
  <main class="page-shell">
    <article class="profile-card">
      <!-- 圆形头像区域，使用内置 SVG 保持页面无需额外图片资源也能显示 -->
      <div class="avatar" role="img" aria-label="林知夏的头像">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="60" fill="#dceeea" />
          <circle cx="60" cy="46" r="21" fill="#f4c7a1" />
          <path d="M38 46c1-22 14-31 25-31 14 0 24 10 24 28-7-6-12-12-14-20-7 12-19 18-35 23Z" fill="#263c3b" />
          <path d="M27 111c4-24 17-36 33-36s29 12 33 36" fill="#78aaa0" />
          <path d="M43 61c5 5 12 7 17 7 7 0 13-2 18-7" fill="none" stroke="#c17b68" stroke-linecap="round" stroke-width="3" />
        </svg>
      </div>

      <!-- 基本身份信息 -->
      <header class="profile-heading">
        <h1>林知夏</h1>
        <p>品牌视觉设计师</p>
      </header>

      <!-- 联系方式列表：每行信息都使用语义化链接，便于直接操作 -->
      <address class="contact-list">
        <a href="mailto:hello@linzhixia.design" class="contact-item">
          <span class="contact-icon" aria-hidden="true">@</span>
          <span>hello@linzhixia.design</span>
        </a>
        <a href="tel:+8613800138000" class="contact-item">
          <span class="contact-icon" aria-hidden="true">☎</span>
          <span>+86 138 0013 8000</span>
        </a>
        <a href="https://www.linzhixia.design" class="contact-item" target="_blank" rel="noreferrer">
          <span class="contact-icon" aria-hidden="true">↗</span>
          <span>www.linzhixia.design</span>
        </a>
      </address>

      <!-- 简短个人签名，作为名片底部的视觉收束 -->
      <p class="profile-note">让每一次视觉表达，都更接近真实。</p>
    </article>
  </main>
</body>
</html>
